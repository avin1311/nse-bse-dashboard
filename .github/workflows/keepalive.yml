name: Keep Render awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        run: |
          URL="${{ secrets.DASHBOARD_URL }}"
          if [ -z "$URL" ]; then URL="https://nse-bse-dashboard.onrender.com"; fi
          curl -sS --max-time 90 --retry 2 "$URL/healthz" || echo "Ping failed (instance may be waking up)"
